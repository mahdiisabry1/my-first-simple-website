<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Sports & Outdoor</title>
  <link rel="stylesheet" href="css/cart.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>

</head>
<body>
  <header>
    <div class="nav">

      <a href="w1954064.html" class="logo">
        Sports & Outdoor
      </a>

      <div class="box">
        <div class="cart-count">0</div>
        <ion-icon name="cart"  id="cart-icon" ></ion-icon>
      </div>

      <div class="cart">
        <div class="cart-title">Cart Items</div>
        <div class="cart-content">

        </div>
        
      <div class="total">
        <div class="total-title">Total</div>
        <div class="total-price">Rs.0</div>
      </div>

      <button class="btn-buy"><a href="payment.html">Place Order</a></button>

      <ion-icon name="close" id="cart-close"></ion-icon>

      </div>
    </div>
  </header>
  <div class="container">
    <h2 class="title">Shop more and Enjoy</h2>
    <div class="shop-content">


      <div class="sport-box">
        <div class="pic">
          <img src="images/1.jpeg" alt="sp1" class="sport-img">
        </div>
        <h2 class="sport-title">Football</h2>
        <span class="sport-price">Rs.3726</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>


      <div class="sport-box">
        <div class="pic"><img src="images/2.jpeg" alt="sp2" class="sport-img"></div>
        <h2 class="sport-title">Rugby Ball</h2>
        <span class="sport-price">Rs.4750</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
      <div class="sport-box">
        <div class="pic"><img src="images/3.jpeg" alt="sp3" class="sport-img"></div>
        <h2 class="sport-title">Cricket Bat</h2>
        <span class="sport-price">Rs.2394</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
      <div class="sport-box">
        <div class="pic"><img src="images/4.jpeg" alt="sp4" class="sport-img"></div>
        <h2 class="sport-title">cricet pad</h2>
        <span class="sport-price">Rs.5990</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
      <div class="sport-box">
        <div class="pic"><img src="images/5.png"  alt="sp5" class="sport-img"></div>
        <h2 class="sport-title">Wicket</h2>
        <span class="sport-price">Rs.1999</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
      <div class="sport-box">
        <div class="pic"><img src="images/6.jpeg" alt="sp6" class="sport-img"></div>
        <h2 class="sport-title">Football Shoe</h2>
        <span class="sport-price">Rs.6324</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
  
      <div class="sport-box">
        <div class="pic"><img src="images/7.jpg" alt="sp7" class="sport-img"></div>
        <h2 class="sport-title">Cricket Ball</h2>
        <span class="sport-price">Rs.450</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  
  
      <div class="sport-box">
        <div class="pic"><img src="images/8.jpg" alt="sp8" class="sport-img"></div>
        <h2 class="sport-title">Badminton</h2>
        <span class="sport-price">Rs.1974</span>
        <ion-icon name="cart" class="add-cart"></ion-icon>
      </div>
  




    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
